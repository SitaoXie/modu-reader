[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "modu-reader"
version = "1.3.0b8"
description = "MODU — a Chinese and English terminal ebook reader for reading while your code runs"
keywords = ["terminal", "ebook-reader", "tui", "chinese", "english", "developer-tools", "txt", "epub", "pdf", "markdown", "offline", "textual"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Text Processing"
]
dependencies = [
  "textual==6.12.0", "pypdf>=7.0,<8", "beautifulsoup4>=4.15,<5",
  "markdown-it-py>=4.2,<5", "charset-normalizer>=3.5,<4", "regex>=2026.9",
  "tinycss2>=1.4,<2", "platformdirs>=4.5,<5", "defusedxml>=0.7.1,<1"
]

[project.urls]
Repository = "https://github.com/SitaoXie/modu-reader"
Issues = "https://github.com/SitaoXie/modu-reader/issues"
Changelog = "https://github.com/SitaoXie/modu-reader/blob/main/CHANGELOG.md"
Security = "https://github.com/SitaoXie/modu-reader/security/policy"

[project.scripts]
modu = "modu.__main__:main"

[project.optional-dependencies]
webview = ["pywebview==6.2.1; sys_platform == 'darwin' or sys_platform == 'win32'"]
translation = ["ctranslate2>=4.8,<5", "sentencepiece>=0.2,<0.3"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.15", "bandit>=1.9,<2", "pip-audit>=2.10,<3", "detect-secrets>=1.5,<2", "build>=1.4,<2", "pyte>=0.8,<1", "pexpect>=4.9,<5; sys_platform != 'win32'"]

[tool.setuptools]
packages = ["modu"]

[tool.setuptools.package-data]
modu = ["*.tcss", "web.html", "web.css", "web.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
