name: Test and audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.23
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run bandit -r modu
      - run: uv run python tools/check_release.py .
      - run: uv run python tools/scan_secrets.py .
      - run: uv build
      - run: uv run python tools/normalize_sdist.py dist
      - name: Check built archives
        shell: bash
        run: uv run python tools/check_release.py dist/*.whl dist/*.tar.gz
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.11.23
      - run: uv sync --frozen
      - run: uv export --frozen --no-dev --no-emit-project --no-hashes -o /tmp/modu-runtime-requirements.txt
      - run: uv run pip-audit -r /tmp/modu-runtime-requirements.txt --disable-pip --no-deps
